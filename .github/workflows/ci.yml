name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # gofmt, go mod tidy, vet, tests against a real OpenLDAP (slapd) and binary smoke test.
  # All inside hack/Dockerfile.test: the same as `make test-docker` locally.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the test image
        run: docker build -f hack/Dockerfile.test -t ldapnav-test .
      - name: Run
        run: docker run --rm ldapnav-test

  # Real keychain (Keychain / Credential Manager), tests without LDAP, binary and .app.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Real keychain
        run: go test -count=1 -v -run TestRealKeyring ./...
        env:
          LDAPNAV_TEST_REAL_KEYRING: "1"
      - name: Remaining tests (no slapd)
        run: go test -count=1 ./...
      - name: Build and smoke-test the binary
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          go build -trimpath -ldflags="-s -w" -o "ldapnav$ext" .
          hack/smoke.sh "./ldapnav$ext"
      - name: make app and smoke-test the .app
        if: runner.os == 'macOS'
        run: |
          make app
          codesign --verify --deep --strict LDAPNav.app
          hack/smoke.sh LDAPNav.app/Contents/MacOS/ldapnav
