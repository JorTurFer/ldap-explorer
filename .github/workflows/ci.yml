name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The LDAP server is only a validation tool: what is under test is the app running
# on each OS, against a real OpenLDAP reachable on 127.0.0.1. Docker is only an
# option on Linux (macOS runners have no Docker engine and Windows runners only run
# Windows containers), so macOS and Windows install a real slapd on the agent.

jobs:
  # gofmt, go mod tidy, vet, tests against a real OpenLDAP (slapd) and binary smoke test.
  # All inside hack/Dockerfile.test: the same as `make test-docker` locally.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the test image
        run: docker build -f hack/Dockerfile.test -t ldapnav-test .
      - name: Run
        run: docker run --rm ldapnav-test

  # Homebrew OpenLDAP (slapd in libexec, slapadd in sbin).
  macos:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
      LDAPNAV_SLAPD_DIR: /opt/homebrew/opt/openldap/libexec
      LDAPNAV_REQUIRE_SLAPD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: brew install openldap
      - name: Real keychain
        run: go test -count=1 -v -run TestRealKeyring ./...
        env:
          LDAPNAV_TEST_REAL_KEYRING: "1"
      - name: Remaining tests
        run: go test -count=1 ./...
      - name: Build and smoke-test the binary
        run: |
          go build -trimpath -ldflags="-s -w" -o ldapnav .
          hack/smoke.sh ./ldapnav
      - name: make app and smoke-test the .app
        run: |
          make app
          codesign --verify --deep --strict LDAPNav.app
          hack/smoke.sh LDAPNav.app/Contents/MacOS/ldapnav

  # Ubuntu's slapd running in WSL1 (no nested virtualization needed). The test
  # harness starts it as a child process and reaches it on 127.0.0.1.
  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
      LDAPNAV_SLAPD_WSL: Ubuntu-24.04
      LDAPNAV_REQUIRE_SLAPD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: Vampire/setup-wsl@v6
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1
          additional-packages: slapd ldap-utils
      - name: Real keychain
        run: go test -count=1 -v -run TestRealKeyring ./...
        env:
          LDAPNAV_TEST_REAL_KEYRING: "1"
      - name: Remaining tests
        run: go test -count=1 ./...
      - name: Build and smoke-test the binary
        shell: bash
        run: |
          go build -trimpath -ldflags="-s -w" -o ldapnav.exe .
          hack/smoke.sh ./ldapnav.exe
